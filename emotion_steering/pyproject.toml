[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-evals"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["steering_evals*"]

[project.entry-points.inspect_ai]
steering_evals = "steering_evals._registry"
