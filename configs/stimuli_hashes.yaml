# Frozen-stimulus MD5 registry.
#
# Every locked stimulus file in data/public/ is fingerprinted here. The
# pre-flight check in scripts/run_experiment.py (and the validators)
# recomputes each file's MD5 and aborts if it differs from the value below
# — tamper-evidence for the pre-registration: stimuli cannot be silently
# edited after locking. Changing a frozen set requires a dated amendment
# block in HYPOTHESES.md AND updating its hash here in the same commit.
# See docs/methods.md §"Stimulus locking".
#
# Keys are filenames relative to data/public/.

